<script>

function generer(){

  const sujet = document.getElementById("sujet").value.trim();
  const type = document.getElementById("type").value;
  const duree = document.getElementById("duree").value;

  if(sujet === ""){
    alert("Écris d'abord ton sujet 🔥");
    return;
  }

  let hook = "Tu pensais tout savoir sur " + sujet + " ? Attends de voir ça… 👀";

  let script = "Aujourd'hui, on parle de : " + sujet + ".\n\n";

  if(type === "Comparaison"){
    script += "D'un côté, tu as une option très populaire. De l'autre, une alternative qui possède aussi de sérieux avantages.\n\n";
    script += "Mais le meilleur choix dépend surtout de ce que tu recherches.\n\n";
    script += "Alors, laquelle choisirais-tu ?";
  }

  else if(type === "Storytelling"){
    script += "Au début, personne ne pensait que cette histoire allait devenir intéressante.\n\n";
    script += "Tout a commencé avec une simple question : " + sujet + ".\n\n";
    script += "Puis les choses ont complètement changé…";
  }

  else if(type === "Quiz"){
    script += "Question : que sais-tu réellement sur " + sujet + " ?\n\n";
    script += "Tu as quelques secondes pour réfléchir.\n\n";
    script += "Alors, tu avais trouvé ?";
  }

  else if(type === "Top 5"){
    script += "Voici 5 choses que tu dois connaître sur " + sujet + ".\n\n";
    script += "Et la dernière pourrait vraiment te surprendre.";
  }

  else{
    script += "Voici ce qu'il faut absolument savoir sur " + sujet + ".\n\n";
    script += "Beaucoup de personnes ignorent cette information.\n\n";
    script += "Maintenant, tu connais l'essentiel.";
  }

  document.getElementById("hook").textContent = hook;

  document.getElementById("script").textContent =
    script + "\n\n⏱️ Format : " + duree;

  document.getElementById("ecran").textContent =
    "🔥 " + sujet + "\n\n👀 Tu connaissais ça ?\n\n👇 Donne ton avis";

  document.getElementById("cta").textContent =
    "Si tu veux d'autres contenus comme celui-ci, abonne-toi et donne ton avis en commentaire. 🔥";

  document.getElementById("resultat").style.display = "block";
}


function copierScript(){

  const texte =
    "🎯 HOOK\n" + document.getElementById("hook").textContent +
    "\n\n🎙️ SCRIPT\n" + document.getElementById("script").textContent +
    "\n\n📱 TEXTE À L'ÉCRAN\n" + document.getElementById("ecran").textContent +
    "\n\n🔥 CTA\n" + document.getElementById("cta").textContent;

  navigator.clipboard.writeText(texte);

  alert("✅ Script copié !");
}

    </script>
