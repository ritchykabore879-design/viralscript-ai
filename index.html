<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViralScript AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:white;
  min-height:100vh;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #292934;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#8b5cf6;
}

.container{
  max-width:700px;
  margin:auto;
  padding:40px 20px;
}

h1{
  text-align:center;
  font-size:35px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:35px;
}

.box{
  background:#15151c;
  border:1px solid #292934;
  border-radius:18px;
  padding:25px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  background:#0d0d12;
  color:white;
  border:1px solid #33333f;
  border-radius:10px;
  padding:14px;
  margin-bottom:20px;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  background:#8b5cf6;
  color:white;
  border:none;
  padding:15px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.result{
  display:none;
  margin-top:25px;
  background:#15151c;
  border:1px solid #292934;
  border-radius:18px;
  padding:25px;
}

.result h2{
  margin-bottom:15px;
}

.result h3{
  margin-top:20px;
  margin-bottom:8px;
  color:#a78bfa;
}

.result p{
  line-height:1.6;
  color:#ddd;
  white-space:pre-line;
}
</style>
</head>

<body>

<header>
  <div class="logo">Viral<span>Script</span> AI</div>
</header>

<div class="container">

<h1>Crée ton script TikTok 🚀</h1>

<p class="subtitle">
Transforme une simple idée en contenu captivant.
</p>

<div class="box">
<div id="compteur" style="text-align:center; margin-bottom:20px; color:#a78bfa; font-weight:bold;">
⚡ Générations gratuites : 5/5
</div>
<label>Ton sujet</label>

<textarea id="sujet"
placeholder="Exemple : Pourquoi les gens préfèrent iPhone ?"></textarea>

<label>Type de contenu</label>

<select id="type">
<option>Comparaison</option>
<option>Storytelling</option>
<option>Quiz</option>
<option>Top 5</option>
<option>Information</option>
</select>

<label>Durée</label>

<select id="duree">
<option>30 secondes</option>
<option>45 secondes</option>
<option>60 secondes</option>
</select>

<button onclick="generer()">
🔥 Générer mon script
</button>

</div>

<div class="result" id="resultat">

<h2>✨ Ton script</h2>

<h3>🎯 HOOK</h3>
<p id="hook"></p>

<h3>🎙️ SCRIPT</h3>
<p id="script"></p>

<h3>📱 TEXTE À L'ÉCRAN</h3>
<p id="ecran"></p>

<h3>🔥 CTA</h3>
<p id="cta"></p>
<button onclick="copierScript()" style="margin-top:20px;">
📋 Copier le script
</button>
</div>

</div>

<script>

function generer(){
let generations = 0;
if(generations >= 5){
  alert("🚫 Tu as utilisé tes 5 générations gratuites aujourd'hui.");
  return;
}

generations++;
localStorage.setItem("generations", generations);
const sujet=document.getElementById("sujet").value.trim();
const type=document.getElementById("type").value;
const duree=document.getElementById("duree").value;
document.getElementById("compteur").textContent =
"⚡ Générations gratuites : " + (5 - generations) + "/5";
if(sujet===""){
alert("Écris d'abord ton sujet 🔥");
return;
}

let hook="Tu pensais tout savoir sur "+sujet+" ? Attends de voir ça… 👀";

let script="Aujourd'hui, on parle de : "+sujet+".\n\n";

if(type==="Comparaison"){
script+="D'un côté, tu as une option très populaire. De l'autre, une alternative qui possède aussi de sérieux avantages.\n\n";
script+="Mais le plus intéressant, c'est que le meilleur choix dépend surtout de ce que tu recherches.\n\n";
script+="Alors, laquelle choisirais-tu ?";
}

else if(type==="Storytelling"){
script+="Au début, personne ne pensait que cette histoire allait devenir intéressante.\n\n";
script+="Tout a commencé avec une simple question : "+sujet+".\n\n";
script+="Puis les choses ont complètement changé…\n\n";
script+="Et c'est là que ça devient vraiment intéressant.";

}

else if(type==="Quiz"){
script+="Question : que sais-tu réellement sur "+sujet+" ?\n\n";
script+="Tu as quelques secondes pour réfléchir avant de choisir ta réponse.\n\n";
script+="Alors, tu avais trouvé ?";

}

else if(type==="Top 5"){
script+="Voici les 5 choses les plus intéressantes à connaître sur "+sujet+".\n\n";
script+="Numéro 5 : un détail que beaucoup de personnes ignorent.\n\n";
script+="Numéro 3 : celui-ci pourrait vraiment te surprendre.\n\n";
script+="Et le numéro 1 est probablement celui dont tu te souviendras le plus.";

}

else{
script+="Voici ce qu'il faut absolument savoir sur "+sujet+".\n\n";
script+="Beaucoup de personnes passent à côté de cette information.\n\n";
script+="Pourtant, elle peut complètement changer la manière dont tu vois le sujet.\n\n";
script+="Maintenant, tu connais l'essentiel.";
}

document.getElementById("hook").textContent=hook;

document.getElementById("script").textContent=
script+"\n\n⏱️ Format : "+duree;

document.getElementById("ecran").textContent=
"🔥 "+sujet+"\n\n"+
"👀 Tu connaissais ça ?\n\n"+
"👇 Donne ton avis";

document.getElementById("cta").textContent=
"Si tu veux d'autres contenus comme celui-ci, abonne-toi et dis-moi ton avis en commentaire. 🔥";

document.getElementById("resultat").style.display="block";

}function copierScript(){

const hook = document.getElementById("hook").textContent;
const script = document.getElementById("script").textContent;
const ecran = document.getElementById("ecran").textContent;
const cta = document.getElementById("cta").textContent;

const texte =
"🎯 HOOK\n" + hook +
"\n\n🎙️ SCRIPT\n" + script +
"\n\n📱 TEXTE À L'ÉCRAN\n" + ecran +
"\n\n🔥 CTA\n" + cta;

navigator.clipboard.writeText(texte);

alert("✅ Script copié !");
}

</script>

</body>
</html>
